<!--    
    Problema 2: Formulario con tres entradas: Nombre, apellidos, edad. 
    Cuando pulsas el botón, añade tu nombre y apellidos a una lista (<li>) donde también pone PUEDE VOTAR si edad >= 18 o NO PUEDE VOTAR    
-->

<html>
<body>

  <form id="miFormulario">
    <input type="text" name="nombre" placeholder="Elisa" required/> 
    <input type="text" name="apellidos" placeholder="Fernández" required/>
    <input type="text" name="edad" placeholder="20" required/>
    <input type="submit" value="REGISTRAR"/>
  </form>

  <div>
    <ul id="laLista">
    </ul>
  </div>

  <script>
    const f = document.getElementById("miFormulario")
    
    f.addEventListener("submit", (e) => {
      e.preventDefault();

      const lista = document.getElementById("laLista");
      const parrafoDatos = document.createElement("li");
      const parrafoMayor = document.createElement("li");

      parrafoDatos.innerText = "Nombre: " + e.target.elements.nombre.value + 
        ", apellidos: " + e.target.elements.apellidos.value + ", edad: " + e.target.elements.edad.value;

    if (e.target.elements.edad.value >= 18) {

        parrafoMayor.innerText = e.target.elements.nombre.value + " PUEDE VOTAR."

    } else {

        parrafoMayor.innerText = e.target.elements.nombre.value + " NO PUEDE VOTAR Y SERÁ SACRIFICADO/A."

    };
        
      lista.appendChild(parrafoDatos);
      lista.appendChild(parrafoMayor);

      e.target.elements.nombre.value = "";
      e.target.elements.apellidos.value = "";
      e.target.elements.edad.value = "";
    })
  </script>

</body>
</html>
