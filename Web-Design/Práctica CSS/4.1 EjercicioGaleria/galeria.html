<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Flex</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body{
            background-color: azure;
            color: black;
        }

        .galeria{
            padding: 25px;
            display: flex;
            flex-direction: row /* es por defecto*/;
            justify-content: space-evenly;
            flex-wrap: wrap;
            
        }

        .galeria .tarjeta{
            flex-basis: 250px; /*da un tamaño base a las tarjetas*/
            flex-grow: 0; /*no crecen*/;
            background-color: white;
            border-radius: 15px;
            overflow: hidden; /*para que no se vea el desbordamiento del pico de la imagen*/

        }

        .tarjeta img{
            width: 100%; /*Medida relativa, depende del padre*/
        }

        .tarjeta .leyenda{
            padding: 0.5rem;
            display: flex;
            gap: 10px;
            flex-direction: column;

        }

        .leyenda h2, .leyenda p {
            margin-bottom: 10px;
        }

        .leyenda a{
            align-self: flex-start;
            background-color: aquamarine;
            text-decoration: none;
            color: white;
            padding: 10px;
            border-radius: 5%;
            width: 100px;
        }


    </style>
</head>
<body>

    <main>
        <section class="galeria">

            <article class="tarjeta">
                <img src="https://picsum.photos/id/1018/600/400" alt="Paisaje natural">
                <div class="leyenda">
                    <h2>Naturaleza</h2>
                    <p>Descubre paisajes únicos y rutas increíbles.</p>
                    <a href="#">Ver destino</a>
                </div>
            </article>

            <article class="tarjeta">
                <img src="https://picsum.photos/id/1015/600/400" alt="Río entre montañas">
                <div class="leyenda">
                    <h2>Aventura</h2>
                    <p>Disfruta del senderismo y las actividades al aire libre.</p>
                    <a href="#">Ver destino</a>
                </div>
            </article>

            <article class="tarjeta">
                <img src="https://picsum.photos/id/1016/600/400" alt="Paisaje de montaña">
                <div class="leyenda">
                    <h2>Montaña</h2>
                    <p>Explora montes, miradores y rincones especiales.</p>
                    <a href="#">Ver destino</a>
                </div>
            </article>

            <article class="tarjeta">
                <img src="https://picsum.photos/id/1019/600/400" alt="Paisaje costero">
                <div class="leyenda">
                    <h2>Costa</h2>
                    <p>Conoce playas, acantilados y pueblos marineros.</p>
                    <a href="#">Ver destino</a>
                </div>
            </article>
        </section>
    </main>

</body>
</html>
