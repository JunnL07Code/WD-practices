<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <style>
        div{
            width: 300px;
            height: 300px;
            display: inline-block
            /*  
            inline: se pone todo en línea, el div ocupa lo que tenga que ocupar solo, así que ignora los tamaños
            inline-block: se pone todo en línea y en bloque, por lo que ocupa tanto como asignes.
            none: oculta un elemento sin dejar su hueco
            */
        }

        p {
            display: inline-block
        }

        .container1{
            background-color: aqua

        }

        .container2{
            background-color: yellowgreen
        }

        .container3{
            background-color: yellow
        }

        img {
            display: none
        }
        h1:hover + img {
            display: block

        }

        /*
        selector:nombre_pseudoclase
        h1:hover 

        Combinadores: + (hermano siguiente)
        */

    </style>
</head>
<body>
    
    <h1>Pasa el ratón</h1>
    <img src="lobster.jpg" alt="tinoníiiiiii">
    
    <div class="container1">
        <p>TÍTULO</p>
    </div>
    <div class="container2">
        <p>TÍTULO</p>
    </div>
    <div class="container3">
        <p>TÍTULO</p>
    </div>


</body>
</html>
