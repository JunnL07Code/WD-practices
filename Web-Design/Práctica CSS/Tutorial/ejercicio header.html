<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Flexbox</title>
    <style>

        *{
            padding: 0;
            margin: 0;
        }

        header{
            background-color: rgb(27, 27, 95);
            color: white;
            font-family:Arial, Helvetica, sans-serif;
            padding: 20px 0px;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .marca {
            display: flex;

        }

        .logo{
            display: inline;
            padding: 18px 15px;
            margin: 0px 15px;
            border: solid white 2px;
            border-radius: 15%;

        }

        nav{

            display: flex;
            justify-content: space-between;
            flex-direction: row;

        }

        a{
            display: flex;
            color: white;
            text-decoration: none;
            vertical-align: middle;

        }

        .acceso {

            height: 50%;
            padding: 15px 15px;
            border: solid white 1px;
            border-radius: 5%;
            
        }


    </style>
</head>

<body>
    <header id="header">
        <div class="marca">
            <div class="logo">DW</div>
            <div>
                <h1>Diseño Web</h1>
                <p>Aprende, crea y comparte</p>
            </div>
        </div>

        <nav class="menu">
            <a href="#" class="activo">Inicio</a>
            <a href="#">Diseño</a>
            <a href="#">Desarrollo</a>
            <a href="#">Recursos</a>
            <a href="#">Proyectos</a>
            <a href="#">Contacto</a>
        </nav>

        <div class="acceso">
            <a href="#">Área alumnado</a>
        </div>

    </header>
</body>
</html>
